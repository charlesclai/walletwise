            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        }

                    </div>

            </div>

                </div>
                <div id="wallet-cards-list" class="space-y-3">
                    </div>
            </div>
        </section>

            loadState();
            populateDropdown();
            renderAll();
            lucide.createIcons();
        });

        function loadState() {
            const savedWallet = localStorage.getItem('walletwise_wallet');
            const savedBenefits = localStorage.getItem('walletwise_benefits');
            if (savedWallet) {
                try { userWallet = JSON.parse(savedWallet); } catch(e) {}
            }
            if (savedBenefits) {
                try { checkedBenefits = JSON.parse(savedBenefits); } catch(e) {}
            }
        }

        function saveState() {
            localStorage.setItem('walletwise_wallet', JSON.stringify(userWallet));
            localStorage.setItem('walletwise_benefits', JSON.stringify(checkedBenefits));
        }

        // Navigation Switcher
        function switchView(viewName) {
            currentActiveView = viewName;
            ['categories', 'wallet', 'benefits'].forEach(v => {
                const sec = document.getElementById(`view-${v}`);
                const btn = document.getElementById(`nav-btn-${v}`);
                if (v === viewName) {
                    sec.classList.remove('hidden');
                    btn.className = "flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl transition text-indigo-400 bg-indigo-500/15 font-semibold";
                } else {
                    sec.classList.add('hidden');
                    btn.className = "flex-1 flex flex-col items-center justify-center py-2.5 rounded-xl transition text-slate-400 hover:text-slate-200 font-medium";
                }
            });
            window.scrollTo({ top: 0, behavior: 'smooth' });
            lucide.createIcons();
        }

        function populateDropdown() {
            const dropdown = document.getElementById('card-select-dropdown');
            dropdown.innerHTML = '<option value="" disabled selected>Select a credit card...</option>';
            
            // Sort database cards alphabetically in the dropdown
            const sortedDb = [...creditCardDatabase].sort((a, b) => a.name.localeCompare(b.name));

            sortedDb.forEach(card => {
                const inWallet = userWallet.includes(card.id);
                if (!inWallet) {
                    const opt = document.createElement('option');
                    opt.value = card.id;
                    opt.textContent = card.name;
                    dropdown.appendChild(opt);
                }
            });
        }

        function addSelectedCard() {
            const dropdown = document.getElementById('card-select-dropdown');
            const cardId = dropdown.value;
            if (!cardId) return;
            if (!userWallet.includes(cardId)) {
                userWallet.push(cardId);
                saveState();
                populateDropdown();
                renderAll();
                dropdown.value = "";
            }
        }

        function removeCard(cardId) {
            userWallet = userWallet.filter(id => id !== cardId);
            saveState();
            populateDropdown();
            renderAll();
        }

        // Multiplier Numeric Parser for Sorting descending
        function parseMultiplierVal(rateStr) {
            if (!rateStr) return 0;
            const match = rateStr.match(/(\d+(\.\d+)?)/);
            return match ? parseFloat(match[1]) : 0;
        }

        // Distinct Badge Color mapping ensuring every multiplier tier has a completely unique color tone
        function getMultiplierBadgeStyle(val) {
            if (val >= 10) return 'bg-fuchsia-500/20 border-fuchsia-500/50 text-fuchsia-300 shadow-sm shadow-fuchsia-500/20';
            if (val >= 6) return 'bg-purple-500/20 border-purple-500/50 text-purple-300';
            if (val >= 5) return 'bg-emerald-500/20 border-emerald-500/50 text-emerald-300 shadow-sm shadow-emerald-500/20';
            if (val >= 4) return 'bg-amber-500/20 border-amber-500/50 text-amber-300 shadow-sm shadow-amber-500/20';
            if (val >= 3) return 'bg-cyan-500/20 border-cyan-500/50 text-cyan-300';
            if (val >= 2) return 'bg-blue-500/20 border-blue-500/50 text-blue-300';
            if (val > 1) return 'bg-indigo-500/20 border-indigo-500/50 text-indigo-300';
            return 'bg-slate-700/60 border-slate-600/60 text-slate-400';
        }

        // Render All Views
        function renderAll() {
            renderHeaderSummary();
            renderWalletView();
            renderCategoriesView();
            renderBenefitsView();
            lucide.createIcons();
        }

        function renderHeaderSummary() {
            const count = userWallet.length;
            document.getElementById('wallet-summary-subtitle').textContent = `${count} active card${count === 1 ? '' : 's'} in wallet`;
            document.getElementById('active-card-count').textContent = `${count} active`;
            document.getElementById('wallet-card-badge').textContent = `${count} active`;
        }

        // Render Wallet View List (Alphabetically Sorted)
        function renderWalletView() {
            const container = document.getElementById('wallet-cards-list');
            if (userWallet.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-8 text-center space-y-3">
                        <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400">
                            <i data-lucide="wallet" class="w-6 h-6"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-300">Your wallet is currently empty</p>
                        <p class="text-xs text-slate-500">Select cards from the dropdown above to populate your active wallet.</p>
                    </div>
                `;
                return;
            }

            // Sort wallet cards alphabetically by card name
            const sortedWalletCardObjects = userWallet.map(cardId => creditCardDatabase.find(c => c.id === cardId)).filter(Boolean);
            sortedWalletCardObjects.sort((a, b) => a.name.localeCompare(b.name));

            container.innerHTML = sortedWalletCardObjects.map(card => {
                return `
                    <div class="bg-gradient-to-r ${card.color} p-4 rounded-2xl border border-slate-700/80 shadow-xl flex items-center justify-between group transition hover:scale-[1.01]">
                        <div class="flex items-center space-x-3.5">
                            <div class="bg-white/10 backdrop-blur-md p-2.5 rounded-xl border border-white/10 text-white">
                                <i data-lucide="credit-card" class="w-5 h-5"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-sm text-white">${card.name}</h4>
                                <p class="text-xs text-slate-300">${card.issuer} • ${card.benefits.length} active benefits</p>
                            </div>
                        </div>
                        <button onclick="removeCard('${card.id}')" class="p-2 rounded-xl bg-black/30 hover:bg-red-500/20 text-slate-300 hover:text-red-400 transition border border-white/10" title="Remove Card">
                            <i data-lucide="trash-2" class="w-4 h-4"></i>
                        </button>
                    </div>
                `;
            }).join('');
        }

        // Render Categories View (Grouped by Multiplier Rate, Sorted Highest to Lowest, filtered out 1x, numbered rank tags)
        function renderCategoriesView() {
            const container = document.getElementById('categories-container');
            if (userWallet.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-8 text-center space-y-3">
                        <p class="text-sm font-medium text-slate-300">No cards in your wallet</p>
                        <p class="text-xs text-slate-500">Add cards in the Wallet tab to calculate optimized multipliers.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = categoryConfig.map(cat => {
                let multipliersList = [];
                userWallet.forEach(cardId => {
                    const card = creditCardDatabase.find(c => c.id === cardId);
                    if (card && card.multipliers[cat.key]) {
                        const m = card.multipliers[cat.key];
                        const numVal = parseMultiplierVal(m.rate);
                        // Exclude 1x multipliers
                        if (numVal > 1) {
                            multipliersList.push({
                                cardName: card.name,
                                issuer: card.issuer,
                                rate: m.rate,
                                desc: m.desc,
                                numericVal: numVal
                            });
                        }
                    }
                });

                if (multipliersList.length === 0) return '';

                // Group multipliers by rate
                let rateGroups = {};
                multipliersList.forEach(item => {
                    if (!rateGroups[item.rate]) {
                        rateGroups[item.rate] = {
                            numericVal: item.numericVal,
                            rate: item.rate,
                            cards: []
                        };
                    }
                    rateGroups[item.rate].cards.push(item);
                });

                // Sort rate groups descending by numericVal
                let sortedRateGroups = Object.values(rateGroups).sort((a, b) => b.numericVal - a.numericVal);

                return `
                    <div class="bg-slate-800/60 backdrop-blur-xl border border-slate-700/80 rounded-2xl p-4 shadow-xl space-y-3">
                        <div class="flex items-center space-x-2 pb-1 border-b border-slate-700/60">
                            <div class="p-1.5 rounded-lg bg-indigo-500/20 text-indigo-400">
                                <i data-lucide="${cat.icon}" class="w-4 h-4"></i>
                            </div>
                            <h3 class="font-bold text-sm text-white">${cat.name}</h3>
                        </div>
                        <div class="space-y-3 pt-1">
                            ${sortedRateGroups.map((group, rankIndex) => {
                                const badgeStyle = getMultiplierBadgeStyle(group.numericVal);
                                const rankNum = rankIndex + 1;
                                return `
                                    <div class="bg-slate-900/60 p-3 rounded-xl border border-slate-800/80 space-y-2">
                                        <div class="flex items-center justify-between pb-1.5 border-b border-slate-800">
                                            <span class="text-xs font-bold text-indigo-400">#${rankNum}</span>
                                            <div class="border px-2.5 py-1 rounded-lg text-xs font-extrabold whitespace-nowrap ${badgeStyle}">
                                                ${group.rate}
                                            </div>
                                        </div>
                                        <div class="space-y-2 pt-0.5">
                                            ${group.cards.map(item => `
                                                <div>
                                                    <span class="text-xs font-bold text-white block">${item.cardName}</span>
                                                    <span class="text-[11px] text-slate-400 block leading-tight">${item.desc}</span>
                                                </div>
                                            `).join('')}
                                        </div>
                                    </div>
                                `;
                            }).join('')}
                        </div>
                    </div>
                `;
            }).join('');
        }

        // Render Benefits View
        function setBenefitFilter(freq) {
            currentBenefitFilter = freq;
            ['all', 'Monthly', 'Semi-Annual', 'Annual'].forEach(f => {
                const btn = document.getElementById(`filter-btn-${f}`);
                if (f === freq) {
                    btn.className = "flex-1 py-1.5 text-xs font-semibold rounded-lg bg-indigo-600 text-white transition shadow-sm";
                } else {
                    btn.className = "flex-1 py-1.5 text-xs font-medium rounded-lg text-slate-400 hover:text-white transition";
                }
            });
            renderBenefitsView();
        }

        function toggleBenefitCheck(benefitId) {
            checkedBenefits[benefitId] = !checkedBenefits[benefitId];
            saveState();
            renderBenefitsView();
        }

        function resetAllBenefits() {
            checkedBenefits = {};
            saveState();
            renderBenefitsView();
        }

        function renderBenefitsView() {
            const container = document.getElementById('benefits-container');
            let allBenefits = [];

            userWallet.forEach(cardId => {
                const card = creditCardDatabase.find(c => c.id === cardId);
                if (card && card.benefits) {
                    card.benefits.forEach(b => {
                        allBenefits.push({
                            ...b,
                            cardName: card.name,
                            cardIssuer: card.issuer
                        });
                    });
                }
            });

            // Update stats
            const totalBenefitsCount = allBenefits.length;
            const claimedCount = allBenefits.filter(b => checkedBenefits[b.id]).length;
            document.getElementById('benefit-stats').textContent = `${claimedCount}/${totalBenefitsCount}`;

            // Filter benefits based on active tab
            let filteredBenefits = allBenefits;
            if (currentBenefitFilter !== 'all') {
                filteredBenefits = allBenefits.filter(b => b.freq === currentBenefitFilter);
            }

            // Sorting logic: Monthly first, then others; and within each group, unchecked items appear before checked items
            filteredBenefits.sort((a, b) => {
                const aChecked = !!checkedBenefits[a.id];
                const bChecked = !!checkedBenefits[b.id];

                // Checked items sink to bottom
                if (aChecked !== bChecked) {
                    return aChecked ? 1 : -1;
                }

                // Monthly comes first among same check status
                const aIsMonthly = a.freq === 'Monthly' ? 0 : 1;
                const bIsMonthly = b.freq === 'Monthly' ? 0 : 1;
                if (aIsMonthly !== bIsMonthly) {
                    return aIsMonthly - bIsMonthly;
                }

                return 0;
            });

            if (filteredBenefits.length === 0) {
                container.innerHTML = `
                    <div class="bg-slate-800/40 border border-slate-700/60 rounded-2xl p-8 text-center space-y-3">
                        <div class="w-12 h-12 bg-slate-800 rounded-full flex items-center justify-center mx-auto text-slate-400">
                            <i data-lucide="gift" class="w-6 h-6"></i>
                        </div>
                        <p class="text-sm font-medium text-slate-300">No benefits found</p>
                        <p class="text-xs text-slate-500">Your current wallet cards have no benefits matching this filter.</p>
                    </div>
                `;
                return;
            }

            container.innerHTML = filteredBenefits.map(b => {
                const isChecked = !!checkedBenefits[b.id];
                return `
                    <div onclick="toggleBenefitCheck('${b.id}')" class="bg-slate-800/60 backdrop-blur-xl border ${isChecked ? 'border-emerald-500/30 bg-emerald-950/10 opacity-75' : 'border-slate-700/80'} rounded-2xl p-4 shadow-xl flex items-start space-x-3.5 cursor-pointer transition hover:border-indigo-500/50">
                        <div class="pt-0.5">
                            <input type="checkbox" ${isChecked ? 'checked' : ''} onclick="event.stopPropagation(); toggleBenefitCheck('${b.id}')" class="w-4 h-4 rounded border-slate-700 bg-slate-900 text-indigo-600 focus:ring-indigo-500 focus:ring-offset-slate-900 cursor-pointer">
                        </div>
                        <div class="flex-1 space-y-1">
                            <div class="flex items-center justify-between">
                                <span class="text-xs font-semibold px-2.5 py-0.5 rounded-full text-center block ${b.freq === 'Monthly' ? 'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30' : b.freq === 'Semi-Annual' ? 'bg-amber-500/20 text-amber-400 border border-amber-500/30' : 'bg-purple-500/20 text-purple-400 border border-purple-500/30'}">${b.freq} Reset</span>
                                <span class="text-xs font-bold text-slate-400 text-right">${b.cardName}</span>
                            </div>
                            <h4 class="font-bold text-sm ${isChecked ? 'line-through text-slate-400' : 'text-white'}">${b.name}</h4>
                            <p class="text-xs text-slate-400 leading-relaxed">${b.desc}</p>
                        </div>
                    </div>
                `;
            }).join('');
            lucide.createIcons();
        }
    </script>
</body>
</html>
