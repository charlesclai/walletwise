            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        @keyframes floatIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        }

                    </div>

            </div>

                </div>
                <div id="wallet-cards-list" class="space-y-3">
                    </div>
            </div>
        </section>

            renderAll();
            lucide.createIcons();
        });

        function loadState() {
            const savedWallet = localStorage.getItem('walletwise_wallet');
            const savedBenefits = localStorage.getItem('walletwise_benefits');
            if (savedWallet) {
                try { userWallet = JSON.parse(savedWallet); } catch(e) {}
            }
            if (savedBenefits) {
                try { checkedBenefits = JSON.parse(savedBenefits); } catch(e) {}
            }
        }

        function saveState() {
            localStorage.setItem('walletwise_wallet', JSON.stringify(userWallet));
            localStorage.setItem('walletwise_benefits', JSON.stringify(checkedBenefits));
        }
